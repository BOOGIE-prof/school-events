services:
  - type: web
    name: school-events
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: SECURE_COOKIES
        value: "1"
      # Строка подключения к PostgreSQL (Neon, Supabase и т.п.).
      # Без неё приложение возьмёт SQLite, а на бесплатном тарифе Render
      # файловая система обнуляется при каждом деплое — данные пропадут.
      - key: DATABASE_URL
        sync: false
